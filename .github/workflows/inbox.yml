name: Save Telegram inbox (owner learnings)
on:
  schedule:
    - cron: "17 * * * *"   # hourly; Telegram keeps unread bot updates for 24 h
  workflow_dispatch:

concurrency: { group: inbox }

jobs:
  inbox:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Fetch new messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_inbox.py
      - name: Commit
        run: |
          git config user.name "inbox-bot"; git config user.email "bot@users.noreply.github.com"
          git add research/inbox
          git diff --cached --quiet && exit 0
          git commit -m "inbox: owner learnings [skip ci]"
          git pull --rebase origin main && git push origin main
